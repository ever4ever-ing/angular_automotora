<div class="app-shell">
  <header class="app-header">
    <div class="header-top">
      @if (esDetalle()) {
        <a routerLink="/catalogo" class="btn-back" aria-label="Volver al catálogo">
          <app-icon name="arrow-left" [size]="22" />
        </a>
      } @else {
        <div class="brand">
          <app-icon class="brand-icon" name="car" [size]="24" />
          <h1 class="brand-title">AutoCatálogo</h1>
        </div>
      }

      @if (!esDetalle()) {
        <div class="buscador">
          <input
            type="search"
            [(ngModel)]="textoBusqueda"
            (input)="onBuscar()"
            placeholder="Buscar marca..."
            class="input-buscar"
            aria-label="Buscar por marca">
        </div>
      } @else {
        <h1 class="header-detalle-title">Detalle del vehículo</h1>
      }
    </div>

    @if (!esDetalle()) {
      <div class="mobile-toolbar">
        <button
          type="button"
          class="toolbar-btn"
          [class.active]="panelMarcasAbierto()"
          (click)="togglePanelMarcas()">
          <app-icon name="tag" [size]="18" /> Marcas
        </button>
        <button
          type="button"
          class="toolbar-btn"
          [class.active]="panelFiltrosAbierto()"
          [class.has-badge]="filtrosActivos()"
          (click)="togglePanelFiltros()">
          <app-icon name="sliders" [size]="18" /> Filtros
        </button>
      </div>
    }
  </header>

  <div class="app-body">
    <aside class="sidebar-desktop" aria-label="Marcas">
      <app-sidebar-autos (marcaSeleccionada)="onMarcaSeleccionada($event)"></app-sidebar-autos>
    </aside>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <aside class="filtros-desktop" aria-label="Filtros">
      <app-filtros-autos></app-filtros-autos>
    </aside>
  </div>

  @if (panelMarcasAbierto() || panelFiltrosAbierto()) {
    <div class="overlay" (click)="cerrarPaneles()" aria-hidden="true"></div>
  }

  <div class="panel-mobile panel-marcas" [class.open]="panelMarcasAbierto()">
    <div class="panel-header">
      <h2>Marcas</h2>
      <button type="button" class="btn-cerrar" (click)="cerrarPaneles()" aria-label="Cerrar">
        <app-icon name="x" [size]="18" />
      </button>
    </div>
    <div class="panel-body">
      <app-sidebar-autos (marcaSeleccionada)="onMarcaSeleccionada($event)"></app-sidebar-autos>
    </div>
  </div>

  <div class="panel-mobile panel-filtros" [class.open]="panelFiltrosAbierto()">
    <div class="panel-header">
      <h2>Filtros</h2>
      <button type="button" class="btn-cerrar" (click)="cerrarPaneles()" aria-label="Cerrar">
        <app-icon name="x" [size]="18" />
      </button>
    </div>
    <div class="panel-body">
      <app-filtros-autos></app-filtros-autos>
    </div>
  </div>

  <footer class="app-footer">
    <p>© {{ 2026 }} AutoCatálogo — Encuentra tu próximo vehículo</p>
  </footer>
</div>
