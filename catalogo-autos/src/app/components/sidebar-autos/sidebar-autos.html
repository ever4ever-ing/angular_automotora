<nav class="marcas-nav" aria-label="Filtrar por marca">
  <button
    type="button"
    class="marca-chip"
    [class.active]="filtroService.marcaSeleccionada() === ''"
    (click)="mostrarTodos()">
    Todas
  </button>
  @for (marca of marcas; track marca) {
    <button
      type="button"
      class="marca-chip"
      [class.active]="isActive(marca)"
      (click)="seleccionarMarca(marca)">
      {{ marca }}
    </button>
  }
</nav>
